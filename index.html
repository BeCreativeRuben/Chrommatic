<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Chromattic - Alternatieve Rockband uit het Waasland</title>
    <meta name="title" content="Chromattic - Alternatieve Rockband uit het Waasland" />
    <meta name="description" content="Chromattic is een alternatieve rockband uit het Waasland die de nostalgie van 2000's poppunk mengt met moderne sounds. Ontdek onze releases, shows en meer." />
    <meta name="keywords" content="Chromattic, alternatieve rock, poppunk, Waasland, Belgische band, Silent Dejection, Circles" />
    <meta name="author" content="Chromattic" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://chromattic.rocks/" />
    <!-- English is a toggle on this same URL, so it has no separate hreflang target. -->
    <link rel="alternate" hreflang="nl-BE" href="https://chromattic.rocks/" />
    <link rel="alternate" hreflang="x-default" href="https://chromattic.rocks/" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="Chromattic, plain-text summary" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chromattic.rocks/" />
    <meta property="og:site_name" content="Chromattic" />
    <meta property="og:title" content="Chromattic - Alternatieve Rockband uit het Waasland" />
    <meta property="og:description" content="Chromattic is een alternatieve rockband uit het Waasland die de nostalgie van 2000's poppunk mengt met moderne sounds." />
    <meta property="og:image" content="https://chromattic.rocks/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chromattic logo op een live foto van de band" />
    <meta property="og:locale" content="nl_BE" />
    <meta property="og:locale:alternate" content="en_GB" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://chromattic.rocks/" />
    <meta name="twitter:title" content="Chromattic - Alternatieve Rockband uit het Waasland" />
    <meta name="twitter:description" content="Chromattic is een alternatieve rockband uit het Waasland die de nostalgie van 2000's poppunk mengt met moderne sounds." />
    <meta name="twitter:image" content="https://chromattic.rocks/images/og-image.jpg" />
    <meta name="twitter:image:alt" content="Chromattic logo op een live foto van de band" />

    <!-- MusicGroup JSON-LD is filled in at build time from the data files. -->
    <script type="application/ld+json" id="band-jsonld">{}</script>

    <!-- Hero photo is the LCP element. Start it before the bundle runs. -->
    <link rel="preload" as="image" href="/images/hero-band-mobile.webp" type="image/webp" media="(max-width: 640px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/hero-band.webp" type="image/webp" media="(min-width: 641px)" fetchpriority="high" />

    <!-- Consent Mode v2 defaults. Analytics storage stays denied until the visitor accepts. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });
      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);
      try {
        var savedLang = localStorage.getItem('chromattic-language');
        if (savedLang === 'en' || savedLang === 'nl') document.documentElement.lang = savedLang;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <noscript>
      <div style="max-width:40rem;margin:2rem auto;padding:1.5rem;font-family:Georgia,serif;color:#111;">
        <h1>Chromattic</h1>
        <p>Alternatieve rockband uit het Waasland (België), opgericht in 2021. Nostalgie van 2000's poppunk gemengd met moderne sounds.</p>
        <p>Leden: Tijl (leadzanger en bassist), Nand (gitarist, audio engineer), Joeri (gitarist, backing vocalist en keyboard), Korneel (drummer).</p>
        <p>Boekingen en vragen: <a href="mailto:chromattic.contact@gmail.com">chromattic.contact@gmail.com</a></p>
        <p>Releases, shows en foto's staan op deze site. Er staan geen boekingsprijzen op de site.</p>
      </div>
    </noscript>
  </body>
</html>
