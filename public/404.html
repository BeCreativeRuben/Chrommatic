<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pagina niet gevonden - Chromattic</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #000;
        color: #fff;
        font-family: Impact, "Arial Narrow", sans-serif;
      }
      main {
        width: min(100%, 36rem);
        text-align: center;
      }
      img { width: 4.5rem; height: auto; }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: clamp(2.5rem, 10vw, 4.5rem);
        letter-spacing: 0.08em;
        line-height: 0.95;
      }
      p {
        font-family: Georgia, serif;
        color: #d1d5db;
        font-size: 1.05rem;
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        margin-top: 0.5rem;
        padding: 0.75rem 1.5rem;
        background: #b91c1c;
        color: #fff;
        text-decoration: none;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.9rem;
      }
      a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/logo-nav.webp" width="64" height="64" alt="Chromattic logo" />
      <h1>404</h1>
      <p>Deze pagina bestaat niet.</p>
      <p lang="en">This page does not exist.</p>
      <p><a href="/">Naar de homepage</a></p>
    </main>
  </body>
</html>
